<!DOCTYPE html>


<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradify - Student Grade Management System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'gradify-navy': '#1B2A4A',
            'gradify-navy-dark': '#111A30',
            'gradify-teal': '#0D9488',
            'gradify-teal-dark': '#0F766E',
            'gradify-teal-light': '#CCFBF1',
            'gradify-pass': '#DCFCE7',
            'gradify-pass-text': '#15803D',
            'gradify-fail': '#FEE2E2',
            'gradify-fail-text': '#B91C1C',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-800 antialiased font-sans">
  <!-- Main Application Container -->
  <div id="app"></div>

  <!-- Delete Student Modal -->
  <div id="deleteStudentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
      <div class="flex items-start space-x-4">
        <div class="p-3 bg-rose-100 text-rose-600 rounded-full shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-900">Delete Student Record?</h3>
          <p class="text-sm text-slate-600 mt-1">
            Are you sure you want to delete <span id="deleteStudentModalName" class="font-semibold text-slate-800"></span>? This action cannot be undone.
          </p>
        </div>
      </div>
      <div class="mt-6 flex justify-end space-x-3">
        <button onclick="closeDeleteModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-slate-700 hover:bg-slate-50 font-medium text-sm transition-colors">
          Cancel
        </button>
        <button onclick="confirmDeleteStudent()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm rounded-xl shadow-md transition-colors">
          Delete Student
        </button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    // Initial Seed Data
    const INITIAL_STUDENTS = [
      {
        id: '2026-0001',
        firstName: 'Liam',
        lastName: 'Garcia',
        grade: 'Grade 7',
        section: '7 · Acacia',
        rawSection: 'Acacia',
        dob: '2013-05-14',
        dobFormatted: 'May 14, 2013',
        gender: 'Male',
        status: 'Enrolled',
        parentName: 'Roberto Garcia',
        relationship: 'Father',
        mobile: '09171234567',
        email: 'r.garcia@gmail.com',
        address: 'Pasig City, Metro Manila',
        teacherNotes: 'Consistent high achiever in Math and Science.',
        grades: { English: 88, Math: 95, Science: 92, Filipino: 90, "Araling Panlipunan": 89, MAPEH: 91 }
      },
      {
        id: '2026-0002',
        firstName: 'Sophia',
        lastName: 'Santos',
        grade: 'Grade 7',
        section: '7 · Acacia',
        rawSection: 'Acacia',
        dob: '2013-08-22',
        dobFormatted: 'August 22, 2013',
        gender: 'Female',
        status: 'Enrolled',
        parentName: 'Elena Santos',
        relationship: 'Mother',
        mobile: '09189876543',
        email: 'e.santos@gmail.com',
        address: 'Pasig City, Metro Manila',
        teacherNotes: 'Needs slight encouragement in class discussions.',
        grades: { English: 85, Math: 80, Science: 82, Filipino: 88, "Araling Panlipunan": 84, MAPEH: 86 }
      },
      {
        id: '2026-0003',
        firstName: 'Juan',
        lastName: 'Dela Cruz',
        grade: 'Grade 7',
        section: '7 · Acacia',
        rawSection: 'Acacia',
        dob: '2013-02-10',
        dobFormatted: 'February 10, 2013',
        gender: 'Male',
        status: 'Enrolled',
        parentName: 'Maria Dela Cruz',
        relationship: 'Mother',
        mobile: '09191112233',
        email: 'mdelacruz@yahoo.com',
        address: 'Pasig City, Metro Manila',
        teacherNotes: 'Requires extra support in Math and Science.',
        grades: { English: 74, Math: 68, Science: 70, Filipino: 76, "Araling Panlipunan": 72, MAPEH: 75 }
      },
      {
        id: '2026-0004',
        firstName: 'Ethan',
        lastName: 'Flores',
        grade: 'Grade 7',
        section: '7 · Narra',
        rawSection: 'Narra',
        dob: '2013-11-03',
        dobFormatted: 'November 3, 2013',
        gender: 'Male',
        status: 'Enrolled',
        parentName: 'Carlos Flores',
        relationship: 'Father',
        mobile: '09204445566',
        email: 'carlos.f@gmail.com',
        address: 'Pasig City, Metro Manila',
        teacherNotes: 'Active class participant and student officer.',
        grades: { English: 90, Math: 88, Science: 94, Filipino: 91, "Araling Panlipunan": 92, MAPEH: 90 }
      }
    ];

    // Persisted or default application state
    let state = {
      isLoggedIn: true, // Set default logged in for preview
      activeTab: 'dashboard',
      selectedStudentId: null,
      selectedSectionFilter: 'All',
      statusFilter: 'All',
      searchQuery: '',
      toastMessage: null,

      // Login form state
      loginEmail: 'maria.cruz@asiasource.edu.ph',
      loginPassword: 'password123',
      loginErrors: {},

      // Teacher Profile
      teacherProfile: {
        name: 'Maria D. Cruz',
        title: 'Grade 7 Adviser & Faculty Member',
        facultyId: 'FAC-2024-089',
        email: 'maria.cruz@asiasource.edu.ph',
        phone: '0917-555-0192',
        emailNotifications: true,
        autoCalculateAverage: true
      },

      // Student Data
      students: JSON.parse(localStorage.getItem('gradify_students')) || INITIAL_STUDENTS,

      // Modal & Form States
      showAddStudentModal: false,
      showEditStudentModal: false,
      showDiscardChangesModal: false,
      showLogoutModal: false,
      showPrintReportModal: false,
      isEditFormDirty: false,

      // Grade Editor State
      gradeEditorStep: 1,
      gradeEditorSection: '7 · Acacia',
      gradeEditorStudentId: '2026-0001',
      gradeEditorTempGrades: {},

      // Forms data
      addForm: {
        firstName: '', lastName: '', section: '7 · Acacia', dob: '', gender: 'Female',
        parentName: '', relationship: 'Mother', mobile: '', email: '', address: '', teacherNotes: ''
      },
      editForm: {}
    };

    let selectedStudentForDelete = null;

    function persistData() {
      localStorage.setItem('gradify_students', JSON.stringify(state.students));
    }

    function calculateAverage(grades) {
      return calcAverage(grades);
    }

    function calcAverage(grades) {
      if (!grades) return "0.00";
      const keys = Object.keys(grades);
      if (keys.length === 0) return "0.00";
      const sum = keys.reduce((acc, k) => acc + (parseFloat(grades[k]) || 0), 0);
      return (sum / keys.length).toFixed(2);
    }

    function isPassing(average) {
      return parseFloat(average) >= 75.00;
    }

    function showToast(msg) {
      state.toastMessage = msg;
      render();
      setTimeout(() => {
        state.toastMessage = null;
        render();
      }, 3500);
    }

    function setTab(tab, studentId = null) {
      state.activeTab = tab;
      if (studentId) {
        state.selectedStudentId = studentId;
      }
      if (tab === 'grades') {
        state.gradeEditorStep = 1;
        if (studentId) {
          state.gradeEditorStudentId = studentId;
          const s = state.students.find(x => x.id === studentId);
          if (s) {
            state.gradeEditorSection = s.section;
            state.gradeEditorTempGrades = { ...s.grades };
            state.gradeEditorStep = 2;
          }
        }
      }
      render();
    }

    function promptDeleteStudent(studentId) {
      const student = state.students.find(s => s.id === studentId);
      if (!student) return;
      
      selectedStudentForDelete = student;
      document.getElementById('deleteStudentModalName').textContent = `${student.firstName} ${student.lastName} (ID: ${student.id})`;
      document.getElementById('deleteStudentModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      selectedStudentForDelete = null;
      document.getElementById('deleteStudentModal').classList.add('hidden');
    }

    function confirmDeleteStudent() {
      if (!selectedStudentForDelete) return;

      const deletedName = `${selectedStudentForDelete.firstName} ${selectedStudentForDelete.lastName}`;
      state.students = state.students.filter(s => s.id !== selectedStudentForDelete.id);
      persistData();

      closeDeleteModal();
      showToast(`Student ${deletedName} deleted successfully`);
      render();
    }

    function openEditStudentModal(student) {
      state.editForm = JSON.parse(JSON.stringify(student));
      state.isEditFormDirty = false;
      state.showEditStudentModal = true;
      render();
    }

    function closeEditStudentModal(checkDirty = true) {
      if (checkDirty && state.isEditFormDirty) {
        state.showDiscardChangesModal = true;
      } else {
        state.showEditStudentModal = false;
        state.showDiscardChangesModal = false;
        state.isEditFormDirty = false;
      }
      render();
    }

    function saveStudentEdits(e) {
      e.preventDefault();
      const idx = state.students.findIndex(s => s.id === state.editForm.id);
      if (idx !== -1) {
        state.editForm.rawSection = state.editForm.section.includes('Acacia') ? 'Acacia' : 'Narra';
        state.students[idx] = { ...state.editForm };
        persistData();
        showToast(`Updated ${state.editForm.firstName} ${state.editForm.lastName}'s details.`);
      }
      state.showEditStudentModal = false;
      state.isEditFormDirty = false;
      render();
    }

    function handleAddStudentSubmit(e) {
      e.preventDefault();
      const newId = `2026-000${state.students.length + 1}`;
      const rawSec = state.addForm.section.includes('Acacia') ? 'Acacia' : 'Narra';
      
      const newStudent = {
        id: newId,
        firstName: state.addForm.firstName,
        lastName: state.addForm.lastName,
        grade: "Grade 7",
        section: state.addForm.section,
        rawSection: rawSec,
        dob: state.addForm.dob,
        dobFormatted: state.addForm.dob ? new Date(state.addForm.dob).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : 'N/A',
        gender: state.addForm.gender,
        status: "Enrolled",
        parentName: state.addForm.parentName,
        relationship: state.addForm.relationship,
        mobile: state.addForm.mobile,
        email: state.addForm.email,
        address: state.addForm.address,
        teacherNotes: state.addForm.teacherNotes,
        grades: {
          English: 75,
          Math: 75,
          Science: 75,
          Filipino: 75,
          "Araling Panlipunan": 75,
          MAPEH: 75
        }
      };

      state.students.push(newStudent);
      persistData();
      state.showAddStudentModal = false;
      showToast(`Student ${newStudent.firstName} ${newStudent.lastName} registered successfully!`);
      state.addForm = {
        firstName: '', lastName: '', section: '7 · Acacia', dob: '',
        gender: 'Female', parentName: '', relationship: 'Mother', mobile: '', email: '', address: '', teacherNotes: ''
      };
      render();
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      state.loginErrors = {};
      if (!state.loginEmail.trim()) {
        state.loginErrors.email = 'School email is required.';
      }
      if (!state.loginPassword.trim()) {
        state.loginErrors.password = 'Password is required.';
      }

      if (Object.keys(state.loginErrors).length === 0) {
        state.isLoggedIn = true;
        state.activeTab = 'dashboard';
        showToast("Welcome back, Teacher Maria!");
      }
      render();
    }

    function handleLogout() {
      state.isLoggedIn = false;
      state.showLogoutModal = false;
      render();
    }

    function handleSaveGrades() {
      const student = state.students.find(s => s.id === state.gradeEditorStudentId);
      if (student) {
        student.grades = { ...state.gradeEditorTempGrades };
        persistData();
        showToast(`Grades for ${student.firstName} ${student.lastName} saved successfully!`);
        state.gradeEditorStep = 3;
      }
      render();
    }

    // Components
    function renderSidebar() {
      const links = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-table-cells-large' },
        { id: 'students', label: 'Students', icon: 'fa-user-group' },
        { id: 'grades', label: 'Grades', icon: 'fa-clipboard-list' },
        { id: 'reports', label: 'Reports', icon: 'fa-chart-line' },
        { id: 'profile', label: 'Profile', icon: 'fa-user' },
      ];

      return `
        <aside class="w-64 bg-white border-r border-gray-200 min-h-screen flex flex-col justify-between p-4 flex-shrink-0">
          <div>
            <div class="flex items-center space-x-3 mb-6 px-2">
              <div class="w-10 h-10 bg-gradify-navy rounded-xl flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-graduation-cap text-xl"></i>
              </div>
              <div>
                <h1 class="font-bold text-gray-900 text-lg leading-tight">Gradify</h1>
                <p class="text-xs text-gray-500 font-normal">Student Grade Management System</p>
              </div>
            </div>

            <div class="px-2 mb-6">
              <p class="text-xs font-semibold text-gray-800 leading-snug">
                Asia Source iCollege – Pasig City Branch
              </p>
            </div>

            <nav class="space-y-1">
              ${links.map(link => {
                const isActive = state.activeTab === link.id;
                return `
                  <button 
                    onclick="setTab('${link.id}')"
                    class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      isActive 
                        ? 'bg-gradify-teal-light text-gradify-teal font-semibold' 
                        : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'
                    }"
                  >
                    <div class="flex items-center space-x-3">
                      <i class="fa-solid ${link.icon} text-base ${isActive ? 'text-gradify-teal' : 'text-gray-400'}"></i>
                      <span>${link.label}</span>
                    </div>
                    ${isActive ? `<div class="w-1.5 h-5 bg-gradify-teal rounded-full"></div>` : ''}
                  </button>
                `;
              }).join('')}

              <button 
                onclick="state.showLogoutModal = true; render();"
                class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all mt-4"
              >
                <i class="fa-solid fa-arrow-right-from-bracket text-base text-gray-400"></i>
                <span>Logout</span>
              </button>
            </nav>
          </div>

          <div class="space-y-4">
            <div class="bg-gray-50 rounded-xl p-3.5 border border-gray-100">
              <p class="text-[11px] font-bold tracking-wider text-gray-400 uppercase">Academic Period</p>
              <p class="text-sm font-bold text-gray-800 mt-0.5">2026–2027 · Quarter 1</p>
              <p class="text-xs text-gray-500 mt-1">Passing threshold: <span class="font-semibold text-gray-700">75</span></p>
            </div>

            <div class="flex items-center space-x-3 pt-2 px-1">
              <div class="w-9 h-9 rounded-full bg-gradify-teal-light text-gradify-teal font-bold flex items-center justify-center text-xs border border-teal-200">
                MC
              </div>
              <div class="overflow-hidden">
                <p class="text-sm font-bold text-gray-900 truncate leading-snug">${state.teacherProfile.name}</p>
                <p class="text-xs text-gray-500 truncate">${state.teacherProfile.title}</p>
              </div>
            </div>
          </div>
        </aside>
      `;
    }

    function renderDashboard() {
      const totalStudents = state.students.length;
      let totalAvgSum = 0;
      let passingCount = 0;
      let failingCount = 0;

      const acaciaStudents = state.students.filter(s => s.section.includes('Acacia'));
      const narraStudents = state.students.filter(s => s.section.includes('Narra'));

      const calcSecAvg = (list) => {
        if (!list.length) return 0;
        const sum = list.reduce((acc, s) => acc + parseFloat(calcAverage(s.grades)), 0);
        return (sum / list.length).toFixed(2);
      };

      const acaciaAvg = calcSecAvg(acaciaStudents);
      const narraAvg = calcSecAvg(narraStudents);

      const acaciaPassing = acaciaStudents.filter(s => isPassing(calcAverage(s.grades))).length;
      const narraPassing = narraStudents.filter(s => isPassing(calcAverage(s.grades))).length;

      state.students.forEach(s => {
        const avg = parseFloat(calcAverage(s.grades));
        totalAvgSum += avg;
        if (avg >= 75) passingCount++;
        else failingCount++;
      });

      const genAverage = totalStudents ? (totalAvgSum / totalStudents).toFixed(2) : '0.00';
      const passPercentage = totalStudents ? ((passingCount / totalStudents) * 100).toFixed(1) : '0.0';

      return `
        <div class="p-8 max-w-7xl mx-auto space-y-8">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-bold text-gray-900">Good day, Maria</h1>
              <p class="text-gray-500 text-sm mt-1">This is your classroom overview for Quarter 1, SY 2026–2027.</p>
            </div>
            <button 
              onclick="state.showAddStudentModal = true; render();"
              class="inline-flex items-center justify-center px-4 py-2.5 bg-gradify-teal hover:bg-gradify-teal-dark text-white rounded-lg font-medium text-sm transition-colors shadow-sm gap-2"
            >
              <i class="fa-solid fa-user-plus text-xs"></i>
              <span>Add Student</span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-start justify-between">
              <div>
                <span class="text-3xl font-extrabold text-gray-900">${totalStudents}</span>
                <p class="text-xs font-semibold text-gray-500 mt-1">Enrolled students</p>
                <p class="text-[11px] text-gray-400 mt-0.5">Across 2 Grade 7 sections</p>
              </div>
              <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
                <i class="fa-solid fa-users text-lg"></i>
              </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-start justify-between">
              <div>
                <span class="text-3xl font-extrabold text-gray-900">${genAverage}</span>
                <p class="text-xs font-semibold text-gray-500 mt-1">Class general average</p>
                <p class="text-[11px] text-gray-400 mt-0.5">Across 2 Grade 7 sections</p>
              </div>
              <div class="w-10 h-10 rounded-full bg-teal-50 text-gradify-teal flex items-center justify-center">
                <i class="fa-solid fa-chart-line text-lg"></i>
              </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-start justify-between">
              <div>
                <span class="text-3xl font-extrabold text-gray-900">${passingCount} / ${totalStudents}</span>
                <p class="text-xs font-semibold text-gray-500 mt-1">Passing students</p>
                <p class="text-[11px] text-gray-400 mt-0.5">${passPercentage}% · threshold 75</p>
              </div>
              <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
                <i class="fa-solid fa-circle-check text-lg"></i>
              </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex items-start justify-between">
              <div>
                <span class="text-3xl font-extrabold text-gray-900">${failingCount}</span>
                <p class="text-xs font-semibold text-gray-500 mt-1">Needs support</p>
                <p class="text-[11px] text-gray-400 mt-0.5">General average below 75</p>
              </div>
              <div class="w-10 h-10 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center">
                <i class="fa-solid fa-flag text-lg"></i>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <h2 class="text-base font-bold text-gray-900">Your sections</h2>
                  <button onclick="setTab('students')" class="text-xs text-gradify-teal hover:underline font-semibold border border-gray-200 px-3 py-1 rounded-md">
                    <i class="fa-solid fa-users text-[10px] mr-1"></i> View Students
                  </button>
                </div>
                <p class="text-xs text-gray-500 mb-4">All student records are complete for this quarter.</p>

                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr class="text-gray-400 font-semibold uppercase tracking-wider border-b border-gray-100">
                        <th class="py-2.5 px-3">Section</th>
                        <th class="py-2.5 px-3">Students</th>
                        <th class="py-2.5 px-3">Average</th>
                        <th class="py-2.5 px-3">Passing</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-gray-700 font-medium">
                      <tr>
                        <td class="py-3 px-3 font-bold text-gray-900">7 · Acacia</td>
                        <td class="py-3 px-3">${acaciaStudents.length}</td>
                        <td class="py-3 px-3">${acaciaAvg}</td>
                        <td class="py-3 px-3">${acaciaPassing} of ${acaciaStudents.length}</td>
                      </tr>
                      <tr>
                        <td class="py-3 px-3 font-bold text-gray-900">7 · Narra</td>
                        <td class="py-3 px-3">${narraStudents.length}</td>
                        <td class="py-3 px-3">${narraAvg}</td>
                        <td class="py-3 px-3">${narraPassing} of ${narraStudents.length}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 flex flex-col justify-between">
              <div>
                <h2 class="text-base font-bold text-gray-900 mb-1">Quarter performance</h2>
                <p class="text-xs text-gray-500 mb-6">General average distribution</p>

                <div class="w-full bg-red-400 rounded-full h-3.5 flex overflow-hidden mb-6">
                  <div class="bg-gradify-teal h-full" style="width: ${passPercentage}%"></div>
                  <div class="bg-rose-500 h-full" style="width: ${100 - passPercentage}%"></div>
                </div>

                <div class="space-y-3">
                  <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2">

                      <span class="font-semibold text-gray-700">Passing</span>
                    </div>
                    <span class="font-bold text-gray-900">${passingCount} students · ${passPercentage}%</span>
                  </div>
                  <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2">

                      <span class="font-semibold text-gray-700">Failing</span>

          <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">

                <thead>
                  <tr class="text-gray-400 font-semibold uppercase tracking-wider border-b border-gray-100">

                    return `
                      <tr class="hover:bg-gray-50 transition-colors">

                        <td class="py-3.5 px-3 text-right">

                            onclick="setTab('students', '${s.id}')"

    function renderStudents() {
      if (state.selectedStudentId) {
        return renderStudentDetail(state.selectedStudentId);
      }

      let filtered = state.students.filter(s => {
        if (state.selectedSectionFilter !== 'All') {
          if (state.selectedSectionFilter === '7 Acacia' && !s.section.includes('Acacia')) return false;
          if (state.selectedSectionFilter === '7 Narra' && !s.section.includes('Narra')) return false;
        }

        const avg = calcAverage(s.grades);
        const pass = isPassing(avg);
        if (state.statusFilter === 'Passed' && !pass) return false;
        if (state.statusFilter === 'Failed' && pass) return false;

        if (state.searchQuery.trim()) {
          const q = state.searchQuery.toLowerCase().trim();
          const fullName = `${s.firstName} ${s.lastName}`.toLowerCase();
          const id = s.id.toLowerCase();
          if (!fullName.includes(q) && !id.includes(q)) return false;
        }

        return true;
      });

      return `
        <div class="p-8 max-w-7xl mx-auto space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">

              onclick="state.showAddStudentModal = true; render();"
              class="inline-flex items-center justify-center px-4 py-2.5 bg-gradify-teal hover:bg-gradify-teal-dark text-white rounded-lg font-medium text-sm transition-colors shadow-sm gap-2"

              <i class="fa-solid fa-user-plus text-xs"></i>

                <label class="block text-xs font-semibold text-gray-700 mb-1">Section</label>
                <select 
                  onchange="state.selectedSectionFilter = this.value; render();" 
                  class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gradify-teal focus:border-gradify-teal outline-none bg-white"
                >
                  <option value="All" ${state.selectedSectionFilter === 'All' ? 'selected' : ''}>All Sections</option>
                  <option value="7 Acacia" ${state.selectedSectionFilter === '7 Acacia' ? 'selected' : ''}>7 Acacia</option>
                  <option value="7 Narra" ${state.selectedSectionFilter === '7 Narra' ? 'selected' : ''}>7 Narra</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Search students</label>
                <div class="relative">
                  <input 
                    type="text" 
                    placeholder="Search by name or student ID"
                    value="${state.searchQuery}"
                    oninput="state.searchQuery = this.value; render();"
                    class="w-full text-sm border border-gray-300 rounded-lg pl-3 pr-8 py-2 focus:ring-2 focus:ring-gradify-teal focus:border-gradify-teal outline-none"
                  />
                  ${state.searchQuery ? `
                    <button onclick="state.searchQuery = ''; render();" class="absolute right-2.5 top-2.5 text-gray-400 hover:text-gray-600">
                      <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                  ` : ''}
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Academic status</label>
                <select 
                  onchange="state.statusFilter = this.value; render();"
                  class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gradify-teal focus:border-gradify-teal outline-none bg-white"
                >
                  <option value="All" ${state.statusFilter === 'All' ? 'selected' : ''}>All statuses</option>
                  <option value="Passed" ${state.statusFilter === 'Passed' ? 'selected' : ''}>Passed</option>
                  <option value="Failed" ${state.statusFilter === 'Failed' ? 'selected' : ''}>Failed</option>
                </select>
              </div>
            </div>

            <div class="pt-2">
              ${filtered.length > 0 ? `
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs">
                    <thead>
                      <tr class="text-gray-400 font-semibold uppercase tracking-wider border-b border-gray-200">
                        <th class="py-3 px-3">Student ID</th>
                        <th class="py-3 px-3">Student Name</th>
                        <th class="py-3 px-3">Section</th>
                        <th class="py-3 px-3">Average</th>
                        <th class="py-3 px-3">Status</th>
                        <th class="py-3 px-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 font-medium text-gray-700">
                      ${filtered.map(s => {
                        const avg = calcAverage(s.grades);
                        const pass = isPassing(avg);
                        return `
                          <tr class="hover:bg-gray-50 transition-colors">
                            <td class="py-3.5 px-3 text-gray-500 font-mono">${s.id}</td>
                            <td class="py-3.5 px-3">
                              <p class="font-bold text-gray-900">${s.firstName} ${s.lastName}</p>
                              <p class="text-[11px] text-gray-400">${s.status} · ${s.grade}</p>
                            </td>
                            <td class="py-3.5 px-3 font-medium text-gray-600">${s.section}</td>
                            <td class="py-3.5 px-3 font-semibold text-gray-900">${avg}</td>
                            <td class="py-3.5 px-3">
                              <span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-semibold ${
                                pass ? 'bg-gradify-pass text-gradify-pass-text' : 'bg-gradify-fail text-gradify-fail-text'
                              }">
                                ${pass ? 'Passing' : 'Failing'}
                              </span>
                            </td>
                            <td class="py-3.5 px-3 text-right space-x-2">
                              <button 
                                onclick="state.selectedStudentId = '${s.id}'; render();" 
                                class="border border-gray-300 hover:border-gray-400 text-gray-700 font-medium px-3 py-1.5 rounded-lg text-xs transition-colors bg-white shadow-sm"
                              >
                                View
                              </button>
                              <button 
                                onclick="promptDeleteStudent('${s.id}')" 
                                class="text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 px-2.5 py-1.5 rounded-lg transition-colors font-medium text-xs inline-flex items-center"
                                title="Delete Record"
                              >
                                <i class="fa-solid fa-trash-can"></i>
                              </button>
                            </td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              ` : `
                <div class="border border-gray-200 rounded-xl p-12 text-center my-4 bg-gray-50/50">
                  <h3 class="text-base font-bold text-gray-800">No matching student records</h3>
                  <p class="text-xs text-gray-500 max-w-md mx-auto mt-1 leading-relaxed">
                    No records match "${state.searchQuery || state.statusFilter}" in selected sections.
                  </p>
                  <button 
                    onclick="state.searchQuery = ''; state.statusFilter = 'All'; state.selectedSectionFilter = 'All'; render();"
                    class="mt-4 px-4 py-2 bg-gradify-teal text-white rounded-lg text-xs font-semibold hover:bg-gradify-teal-dark transition-colors shadow-sm"
                  >
                    Clear filters
                  </button>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderStudentDetail(studentId) {
      const student = state.students.find(s => s.id === studentId);
      if (!student) {
        state.selectedStudentId = null;
        return renderStudents();
      }

      const avg = calcAverage(student.grades);
      const pass = isPassing(avg);

      return `
        <div class="p-8 max-w-7xl mx-auto space-y-6">
          <div>
            <button 
              onclick="state.selectedStudentId = null; render();" 
              class="inline-flex items-center space-x-2 text-xs font-semibold text-gray-500 hover:text-gray-900 transition-colors mb-3"
            >
              <i class="fa-solid fa-arrow-left text-xs"></i>
              <span>Back · Students</span>
            </button>
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div class="flex items-center space-x-3">
                  <h1 class="text-3xl font-bold text-gray-900">${student.firstName} ${student.lastName}</h1>
                  <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${
                    pass ? 'bg-gradify-pass text-gradify-pass-text' : 'bg-gradify-fail text-gradify-fail-text'

                    ${pass ? 'Passing' : 'Failing'}
                  </span>

              </div>

              <div class="flex items-center space-x-3">
                <button 
                  onclick="openEditStudentModal(state.students.find(s => s.id === '${student.id}'))"
                  class="px-4 py-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg text-xs transition-colors shadow-sm inline-flex items-center gap-2"
                >
                  <i class="fa-solid fa-pen text-xs"></i>
                  <span>Edit Info</span>
                </button>

                <button 
                  onclick="setTab('grades', '${student.id}')"
                  class="px-4 py-2 bg-gradify-teal hover:bg-gradify-teal-dark text-white font-semibold rounded-lg text-xs transition-colors shadow-sm inline-flex items-center gap-2"
                >
                  <i class="fa-solid fa-pen-to-square text-xs"></i>
                  <span>Edit Grades</span>
                </button>

                <button 
                  onclick="promptDeleteStudent('${student.id}')"
                  class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-lg text-xs transition-colors border border-rose-200"
                  title="Delete Student"
                >
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
              <h2 class="text-base font-bold text-gray-900 pb-2 border-b border-gray-100">Personal Information</h2>
              <div class="grid grid-cols-2 gap-4 text-xs">
                <div>
                  <p class="text-gray-400 font-medium">Full Name</p>
                  <p class="font-bold text-gray-800 text-sm mt-0.5">${student.firstName} ${student.lastName}</p>
                </div>
                <div>
                  <p class="text-gray-400 font-medium">Date of Birth</p>
                  <p class="font-semibold text-gray-800 text-sm mt-0.5">${student.dobFormatted || student.dob}</p>
                </div>
                <div>
                  <p class="text-gray-400 font-medium">Gender</p>
                  <p class="font-semibold text-gray-800 text-sm mt-0.5">${student.gender}</p>
                </div>
                <div>
                  <p class="text-gray-400 font-medium">Enrollment Status</p>
                  <p class="font-semibold text-gray-800 text-sm mt-0.5">${student.status}</p>
                </div>
                <div class="col-span-2">
                  <p class="text-gray-400 font-medium">Home Address</p>
                  <p class="font-semibold text-gray-800 text-sm mt-0.5">${student.address || 'N/A'}</p>
                </div>
              </div>
            </div>

            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
              <h2 class="text-base font-bold text-gray-900 pb-2 border-b border-gray-100">Guardian & Contact Information</h2>
              <div class="grid grid-cols-2 gap-4 text-xs">
                <div>
                  <p class="text-gray-400 font-medium">Parent / Guardian</p>
                  <p class="font-bold text-gray-800 text-sm mt-0.5">${student.parentName || 'N/A'}</p>
                </div>
                <div>
                  <p class="text-gray-400 font-medium">Relationship</p>
                  <p class="font-semibold text-gray-800 text-sm mt-0.5">${student.relationship || 'N/A'}</p>
                </div>
                <div>
                  <p class="text-gray-400 font-medium">Mobile Number</p>
                  <p class="font-semibold text-gray-800 text-sm mt-0.5">${student.mobile || 'N/A'}</p>
                </div>
                <div>
                  <p class="text-gray-400 font-medium">Email Address</p>
                  <p class="font-semibold text-gray-800 text-sm mt-0.5">${student.email || 'N/A'}</p>
                </div>
                <div class="col-span-2">
                  <p class="text-gray-400 font-medium">Teacher Notes</p>
                  <p class="font-normal text-gray-600 text-xs mt-1 italic">${student.teacherNotes || 'No notes added.'}</p>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
            <div class="flex items-center justify-between pb-2 border-b border-gray-100">
              <div>
                <h2 class="text-base font-bold text-gray-900">Academic Performance · Quarter 1</h2>
                <p class="text-xs text-gray-500 mt-0.5">Subject grade breakdown</p>
              </div>
              <div class="text-right">
                <span class="text-2xl font-black text-gray-900">${avg}</span>
                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">General Average</p>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="text-gray-400 font-semibold uppercase tracking-wider border-b border-gray-100">
                    <th class="py-3 px-3">Subject</th>
                    <th class="py-3 px-3 text-center">Grade</th>
                    <th class="py-3 px-3 text-center">Status</th>
                    <th class="py-3 px-3">Remarks</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 font-medium text-gray-700">
                  ${Object.entries(student.grades).map(([subj, score]) => {
                    const subjPass = score >= 75;
                    return `
                      <tr class="hover:bg-gray-50 transition-colors">
                        <td class="py-3.5 px-3 font-bold text-gray-900">${subj}</td>
                        <td class="py-3.5 px-3 text-center font-bold text-sm ${subjPass ? 'text-gray-800' : 'text-rose-600'}">${score}</td>
                        <td class="py-3.5 px-3 text-center">
                          <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                            subjPass ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                          }">
                            ${subjPass ? 'PASSED' : 'NEEDS SUPPORT'}
                          </span>
                        </td>
                        <td class="py-3.5 px-3 text-gray-500 text-xs">
                          ${subjPass ? 'Satisfactory academic progress' : 'Requires immediate academic assistance'}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderGrades() {
      const selectedStudent = state.students.find(s => s.id === state.gradeEditorStudentId) || state.students[0];

      const sectionStudents = state.students.filter(s => {
        if (state.gradeEditorSection === '7 · Acacia') return s.section.includes('Acacia');
        if (state.gradeEditorSection === '7 · Narra') return s.section.includes('Narra');
        return true;
      });

      if (!state.gradeEditorTempGrades || Object.keys(state.gradeEditorTempGrades).length === 0) {
        state.gradeEditorTempGrades = selectedStudent ? { ...selectedStudent.grades } : {};
      }

      const tempAvg = calcAverage(state.gradeEditorTempGrades);
      const tempPass = isPassing(tempAvg);

      const lowSubjects = Object.entries(state.gradeEditorTempGrades).filter(([_, score]) => Number(score) < 75);

      return `
        <div class="p-8 max-w-5xl mx-auto space-y-6">
          <div>
            <h1 class="text-3xl font-bold text-gray-900">Grade Management</h1>
            <p class="text-gray-500 text-sm mt-1">Input and manage Quarter 1 subject scores for students.</p>
          </div>

          <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-around text-xs font-bold">
            <div class="flex items-center space-x-2 ${state.gradeEditorStep >= 1 ? 'text-gradify-teal' : 'text-gray-400'}">
              <span class="w-6 h-6 rounded-full border-2 border-current flex items-center justify-center text-xs">1</span>
              <span>Select Student</span>
            </div>
            <div class="w-12 h-0.5 bg-gray-200"></div>
            <div class="flex items-center space-x-2 ${state.gradeEditorStep >= 2 ? 'text-gradify-teal' : 'text-gray-400'}">
              <span class="w-6 h-6 rounded-full border-2 border-current flex items-center justify-center text-xs">2</span>
              <span>Input & Calculate Grades</span>
            </div>
            <div class="w-12 h-0.5 bg-gray-200"></div>
            <div class="flex items-center space-x-2 ${state.gradeEditorStep >= 3 ? 'text-gradify-teal' : 'text-gray-400'}">
              <span class="w-6 h-6 rounded-full border-2 border-current flex items-center justify-center text-xs">3</span>
              <span>Review Summary</span>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
            <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider">Step 1: Choose Section & Student</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Select Section</label>
                <select 
                  onchange="
                    state.gradeEditorSection = this.value; 
                    const firstInSec = state.students.find(s => this.value.includes('Acacia') ? s.section.includes('Acacia') : s.section.includes('Narra'));
                    if(firstInSec) {
                      state.gradeEditorStudentId = firstInSec.id;
                      state.gradeEditorTempGrades = {...firstInSec.grades};
                    }
                    render();
                  "
                  class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gradify-teal focus:border-gradify-teal outline-none bg-white"
                >
                  <option value="7 · Acacia" ${state.gradeEditorSection.includes('Acacia') ? 'selected' : ''}>7 · Acacia</option>
                  <option value="7 · Narra" ${state.gradeEditorSection.includes('Narra') ? 'selected' : ''}>7 · Narra</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Select Student</label>
                <select 
                  onchange="
                    state.gradeEditorStudentId = this.value; 
                    const s = state.students.find(x => x.id === this.value);
                    if(s) state.gradeEditorTempGrades = {...s.grades};
                    state.gradeEditorStep = 2;
                    render();
                  "
                  class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-gradify-teal focus:border-gradify-teal outline-none bg-white"
                >
                  ${sectionStudents.map(s => `
                    <option value="${s.id}" ${s.id === (selectedStudent ? selectedStudent.id : '') ? 'selected' : ''}>
                      ${s.firstName} ${s.lastName} (${s.id})
                    </option>
                  `).join('')}
                </select>
              </div>
            </div>
          </div>

          ${selectedStudent ? `
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-gray-100 gap-2">
                <div>
                  <h2 class="text-lg font-bold text-gray-900">${selectedStudent.firstName} ${selectedStudent.lastName}</h2>
                  <p class="text-xs text-gray-500">Student ID: ${selectedStudent.id} · ${selectedStudent.section}</p>
                </div>
                <div class="text-left sm:text-right">
                  <span class="text-3xl font-black text-gray-900">${tempAvg}</span>
                  <div class="mt-0.5">
                    <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                      tempPass ? 'bg-gradify-pass text-gradify-pass-text' : 'bg-gradify-fail text-gradify-fail-text'
                    }">
                      ${tempPass ? 'Passing' : 'Failing'}
                    </span>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                ${Object.entries(state.gradeEditorTempGrades).map(([subject, val]) => {
                  const isFail = Number(val) < 75;
                  return `
                    <div class="p-3.5 border rounded-xl transition-all ${isFail ? 'border-rose-300 bg-rose-50/30' : 'border-gray-200 bg-gray-50/50'}">
                      <label class="block text-xs font-bold text-gray-800 mb-1.5">${subject}</label>
                      <div class="relative">
                        <input 
                          type="number" 
                          min="0" 
                          max="100"
                          value="${val}"
                          oninput="
                            state.gradeEditorTempGrades['${subject}'] = Math.min(100, Math.max(0, parseFloat(this.value) || 0));
                            render();
                          "
                          class="w-full text-base font-bold text-gray-900 border ${isFail ? 'border-rose-400 focus:ring-rose-400' : 'border-gray-300 focus:ring-gradify-teal'} rounded-lg px-3 py-1.5 outline-none bg-white"
                        />
                        <span class="absolute right-3 top-2.5 text-xs text-gray-400 font-semibold">%</span>
                      </div>
                      ${isFail ? `<p class="text-[10px] text-rose-600 font-semibold mt-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Below threshold (75)</p>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>

              ${lowSubjects.length > 0 ? `
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start space-x-3 text-amber-900 text-xs">
                  <i class="fa-solid fa-circle-exclamation text-amber-600 text-base mt-0.5"></i>
                  <div>
                    <p class="font-bold">Academic Support Needed</p>
                    <p class="mt-0.5 text-amber-800 leading-relaxed">
                      This student is scoring below 75 in: <span class="font-bold">${lowSubjects.map(s => s[0]).join(', ')}</span>.
                    </p>
                  </div>
                </div>
              ` : ''}

              <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
                <button 
                  onclick="
                    state.gradeEditorTempGrades = {...selectedStudent.grades};
                    showToast('Reverted modifications.');
                    render();
                  "
                  class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg text-xs transition-colors"
                >
                  Reset Changes
                </button>
                <button 
                  onclick="handleSaveGrades()"
                  class="px-5 py-2 bg-gradify-teal hover:bg-gradify-teal-dark text-white font-semibold rounded-lg text-xs transition-colors shadow-sm inline-flex items-center gap-2"
                >
                  <i class="fa-solid fa-check text-xs"></i>
                  <span>Save Grades & Calculate</span>
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderReports() {
      return `
        <div class="p-8 max-w-7xl mx-auto space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-bold text-gray-900">Academic Reports</h1>
              <p class="text-gray-500 text-sm mt-1">Export summary reports and print official student report cards.</p>
            </div>
            <div class="flex items-center space-x-3">
              <button 
                onclick="showToast('Exported Section Summary to CSV.');"
                class="px-4 py-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg text-xs transition-colors shadow-sm inline-flex items-center gap-2"
              >
                <i class="fa-solid fa-file-csv text-xs text-emerald-600"></i>
                <span>Export CSV</span>
              </button>
              <button 
                onclick="state.showPrintReportModal = true; render();"
                class="px-4 py-2 bg-gradify-teal hover:bg-gradify-teal-dark text-white font-semibold rounded-lg text-xs transition-colors shadow-sm inline-flex items-center gap-2"
              >
                <i class="fa-solid fa-print text-xs"></i>
                <span>Print Official Summary</span>
              </button>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
            <h2 class="text-base font-bold text-gray-900">Quarter 1 Complete Roster Report</h2>
            
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="text-gray-400 font-semibold uppercase tracking-wider border-b border-gray-200">
                    <th class="py-3 px-3">Student Name</th>
                    <th class="py-3 px-3">ID</th>
                    <th class="py-3 px-3">Section</th>
                    <th class="py-3 px-3 text-center">ENG</th>
                    <th class="py-3 px-3 text-center">MATH</th>
                    <th class="py-3 px-3 text-center">SCI</th>
                    <th class="py-3 px-3 text-center">FIL</th>
                    <th class="py-3 px-3 text-center">AP</th>
                    <th class="py-3 px-3 text-center">MAPEH</th>
                    <th class="py-3 px-3 text-center">AVERAGE</th>
                    <th class="py-3 px-3 text-right">STATUS</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 font-medium text-gray-700">
                  ${state.students.map(s => {
                    const avg = calcAverage(s.grades);
                    const pass = isPassing(avg);
                    return `
                      <tr class="hover:bg-gray-50">
                        <td class="py-3 px-3 font-bold text-gray-900">${s.firstName} ${s.lastName}</td>
                        <td class="py-3 px-3 font-mono text-gray-500">${s.id}</td>
                        <td class="py-3 px-3 text-gray-600">${s.section}</td>
                        <td class="py-3 px-3 text-center">${s.grades.English}</td>
                        <td class="py-3 px-3 text-center">${s.grades.Math}</td>
                        <td class="py-3 px-3 text-center">${s.grades.Science}</td>
                        <td class="py-3 px-3 text-center">${s.grades.Filipino}</td>
                        <td class="py-3 px-3 text-center">${s.grades["Araling Panlipunan"]}</td>
                        <td class="py-3 px-3 text-center">${s.grades.MAPEH}</td>
                        <td class="py-3 px-3 text-center font-bold text-gray-900">${avg}</td>
                        <td class="py-3 px-3 text-right">
                          <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold ${
                            pass ? 'bg-gradify-pass text-gradify-pass-text' : 'bg-gradify-fail text-gradify-fail-text'
                          }">
                            ${pass ? 'PASSED' : 'FAILED'}
                          </span>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderProfile() {
      const p = state.teacherProfile;
      return `
        <div class="p-8 max-w-4xl mx-auto space-y-6">
          <div>
            <h1 class="text-3xl font-bold text-gray-900">Teacher Profile</h1>
            <p class="text-gray-500 text-sm mt-1">Manage your account settings and preferences.</p>
          </div>

          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6">
            <div class="flex items-center space-x-4 pb-6 border-b border-gray-100">
              <div class="w-16 h-16 rounded-full bg-gradify-teal-light text-gradify-teal font-extrabold flex items-center justify-center text-xl border-2 border-teal-200">
                MC
              </div>
              <div>
                <h2 class="text-xl font-bold text-gray-900">${p.name}</h2>
                <p class="text-xs text-gray-500">${p.title} · Faculty ID: <span class="font-mono text-gray-700">${p.facultyId}</span></p>
              </div>
            </div>

            <form onsubmit="event.preventDefault(); showToast('Profile settings saved successfully.');" class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Full Name</label>
                  <input type="text" value="${p.name}" oninput="state.teacherProfile.name = this.value" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-gradify-teal">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">School Email</label>
                  <input type="email" value="${p.email}" disabled class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-gray-500 cursor-not-allowed">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Faculty ID</label>
                  <input type="text" value="${p.facultyId}" disabled class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-gray-500 cursor-not-allowed">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Contact Phone</label>
                  <input type="text" value="${p.phone}" oninput="state.teacherProfile.phone = this.value" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-gradify-teal">
                </div>
              </div>

              <div class="pt-4 text-right">
                <button type="submit" class="px-5 py-2 bg-gradify-teal hover:bg-gradify-teal-dark text-white font-semibold rounded-lg text-xs transition-colors shadow-sm">
                  Save Profile Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderLogin() {
      const err = state.loginErrors;

      return `
        <div class="min-h-screen flex flex-col md:flex-row bg-white">
          <div class="md:w-1/2 bg-gradify-navy p-12 flex flex-col justify-center items-center text-center text-white relative min-h-[400px]">
            <div class="max-w-md space-y-6">
              <div class="w-32 h-32 mx-auto rounded-full border-4 border-teal-500/30 flex items-center justify-center bg-gradify-navy-dark shadow-2xl relative">
                <i class="fa-solid fa-graduation-cap text-6xl text-amber-500"></i>
              </div>

              <div>
                <h1 class="text-4xl font-extrabold tracking-tight">Gradify</h1>
                <p class="text-sm text-gray-300 mt-2 font-light tracking-wide">Student Grade Management System</p>
              </div>
            </div>
          </div>

          <div class="md:w-1/2 p-8 md:p-16 flex flex-col justify-center max-w-lg mx-auto w-full">
            <div class="space-y-6">
              <div>
                <h2 class="text-3xl font-bold text-gray-900">Welcome back, teacher</h2>
                <p class="text-sm text-gray-500 mt-1">Log in to manage your classroom records.</p>
              </div>

              <form onsubmit="handleLoginSubmit(event)" class="space-y-5">
                <div>
                  <label class="block text-xs font-semibold text-gray-700 mb-1">School email</label>
                  <input 
                    type="text" 
                    value="${state.loginEmail}"
                    oninput="state.loginEmail = this.value"
                    placeholder="Enter your school email"
                    class="w-full text-sm border ${err.email ? 'border-rose-500' : 'border-gray-300'} rounded-lg px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-gradify-teal"
                  />
                  ${err.email ? `<p class="text-xs text-rose-500 mt-1 font-medium">${err.email}</p>` : ''}
                </div>

                <div>
                  <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                  <input 
                    type="password" 
                    value="${state.loginPassword}"
                    oninput="state.loginPassword = this.value"
                    placeholder="Enter your password"
                    class="w-full text-sm border ${err.password ? 'border-rose-500' : 'border-gray-300'} rounded-lg px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-gradify-teal"
                  />
                  ${err.password ? `<p class="text-xs text-rose-500 mt-1 font-medium">${err.password}</p>` : ''}
                </div>

                <button 
                  type="submit" 
                  class="w-full py-3 bg-gradify-teal hover:bg-gradify-teal-dark text-white font-semibold rounded-lg text-sm transition-colors shadow-sm"
                >
                  Login
                </button>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function renderEditStudentModal() {
      if (!state.showEditStudentModal) return '';
      const f = state.editForm;

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
          <div class="bg-white rounded-2xl border border-gray-200 shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-8 space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-gray-100">
              <div>
                <h2 class="text-2xl font-bold text-gray-900">Edit student</h2>
                <p class="text-xs text-gray-500">Update ${f.firstName} ${f.lastName}’s details.</p>
              </div>
              <button onclick="closeEditStudentModal(true)" class="text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form onsubmit="saveStudentEdits(event)" class="space-y-6">
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 text-xs">
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">First name *</label>
                  <input type="text" required value="${f.firstName}" oninput="state.editForm.firstName = this.value; state.isEditFormDirty = true;" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-gradify-teal">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Last name *</label>
                  <input type="text" required value="${f.lastName}" oninput="state.editForm.lastName = this.value; state.isEditFormDirty = true;" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-gradify-teal">
                </div>
              </div>

              <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
                <button type="button" onclick="closeEditStudentModal(true)" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg text-xs">
                  Cancel
                </button>
                <button type="submit" class="px-5 py-2 bg-gradify-teal hover:bg-gradify-teal-dark text-white font-semibold rounded-lg text-xs shadow-sm">
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderAddStudentModal() {
      if (!state.showAddStudentModal) return '';
      const a = state.addForm;

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
          <div class="bg-white rounded-2xl border border-gray-200 shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-8 space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-gray-100">
              <div>
                <h2 class="text-2xl font-bold text-gray-900">Register New Student</h2>
                <p class="text-xs text-gray-500">Fill in the details to register a student.</p>
              </div>
              <button onclick="state.showAddStudentModal = false; render();" class="text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form onsubmit="handleAddStudentSubmit(event)" class="space-y-4 text-xs">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">First Name *</label>
                  <input type="text" required value="${a.firstName}" oninput="state.addForm.firstName = this.value" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-gradify-teal">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Last Name *</label>
                  <input type="text" required value="${a.lastName}" oninput="state.addForm.lastName = this.value" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-gradify-teal">
                </div>
                <div>
                  <label class="block font-semibold text-gray-700 mb-1">Section *</label>
                  <select onchange="state.addForm.section = this.value" class="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:border-gradify-teal bg-white">
                    <option value="7 · Acacia">7 · Acacia</option>
                    <option value="7 · Narra">7 · Narra</option>
                  </select>
                </div>
              </div>

              <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
                <button type="button" onclick="state.showAddStudentModal = false; render();" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg text-xs">
                  Cancel
                </button>
                <button type="submit" class="px-5 py-2 bg-gradify-teal hover:bg-gradify-teal-dark text-white font-semibold rounded-lg text-xs shadow-sm">
                  Register Student
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderDiscardChangesModal() {
      if (!state.showDiscardChangesModal) return '';

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-gray-100">
            <h3 class="text-xl font-bold text-gray-900">Discard unsaved changes?</h3>
            <p class="text-xs text-gray-500">Your modifications have not been saved.</p>
            <div class="flex items-center justify-end space-x-3 pt-3">
              <button onclick="state.showDiscardChangesModal = false; render();" class="px-4 py-2 bg-gradify-teal text-white font-semibold rounded-lg text-xs">Keep editing</button>
              <button onclick="closeEditStudentModal(false);" class="px-4 py-2 bg-rose-600 text-white font-semibold rounded-lg text-xs">Discard changes</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderLogoutModal() {
      if (!state.showLogoutModal) return '';

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-4 border border-gray-100">
            <h3 class="text-lg font-bold text-gray-900">Confirm Logout</h3>
            <p class="text-xs text-gray-500">Are you sure you want to end your current session?</p>
            <div class="flex items-center justify-end space-x-3 pt-2">
              <button onclick="state.showLogoutModal = false; render();" class="px-4 py-2 border border-gray-300 text-gray-700 font-semibold rounded-lg text-xs">Cancel</button>
              <button onclick="handleLogout()" class="px-4 py-2 bg-rose-600 text-white font-semibold rounded-lg text-xs">Logout</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPrintReportModal() {
      if (!state.showPrintReportModal) return '';

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
          <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full p-8 space-y-6">
            <div class="flex justify-between items-center pb-4 border-b">
              <h2 class="text-lg font-bold text-gray-900">Official Grade Summary Preview</h2>
              <button onclick="state.showPrintReportModal = false; render();" class="text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div class="border p-6 bg-white space-y-4 text-xs">
              <h1 class="text-lg font-bold text-center">Quarterly Grade Summary</h1>
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b">
                    <th class="py-2">Student Name</th>
                    <th class="py-2">Section</th>
                    <th class="py-2 text-center">General Avg</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.students.map(s => `
                    <tr class="border-b">
                      <td class="py-2 font-bold">${s.firstName} ${s.lastName}</td>
                      <td class="py-2">${s.section}</td>
                      <td class="py-2 text-center">${calcAverage(s.grades)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div class="flex justify-end space-x-3">
              <button onclick="state.showPrintReportModal = false; render();" class="px-4 py-2 border text-xs font-semibold rounded-lg">Close</button>
              <button onclick="window.print();" class="px-5 py-2 bg-gradify-teal text-white text-xs font-semibold rounded-lg">Print</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderToast() {
      if (!state.toastMessage) return '';
      return `
        <div class="fixed bottom-6 right-6 z-50 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center space-x-3">
          <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
          <span>${state.toastMessage}</span>
        </div>
      `;
    }

    // Main App Render
    function render() {
      const app = document.getElementById('app');

      if (!state.isLoggedIn) {
        app.innerHTML = renderLogin();
        return;
      }

      let content = '';
      switch (state.activeTab) {
        case 'dashboard':
          content = renderDashboard();
          break;
        case 'students':
          content = renderStudents();
          break;
        case 'grades':
          content = renderGrades();
          break;
        case 'reports':
          content = renderReports();
          break;
        case 'profile':
          content = renderProfile();
          break;
        default:
          content = renderDashboard();
      }

      app.innerHTML = `
        <div class="flex min-h-screen">
          ${renderSidebar()}
          <main class="flex-1 overflow-y-auto custom-scrollbar">
            ${content}
          </main>
        </div>
        ${renderEditStudentModal()}
        ${renderAddStudentModal()}
        ${renderDiscardChangesModal()}
        ${renderLogoutModal()}
        ${renderPrintReportModal()}
        ${renderToast()}
      `;
    }

    // Initial render on load
    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
